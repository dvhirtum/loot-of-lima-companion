# Shared by the /api and /hub locations.
#
# A separate file rather than these lines sitting at server level, because nginx does not merge
# proxy_set_header: a location that sets even one of its own discards every inherited one. The
# /hub block has to set Upgrade and Connection, so inheriting would silently drop the Host header
# below -- and the QR code would be wrong with nothing to say why.

proxy_http_version 1.1;

# $http_host, not $host. $host drops the port, and the server builds the join URL the QR code
# encodes out of this header: on a phone reaching the table at 192.168.1.50:4200, $host would
# produce a code pointing at port 80. This is the same reason proxy.conf.json sets
# changeOrigin: false for the dev server.
proxy_set_header Host $http_host;

proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
