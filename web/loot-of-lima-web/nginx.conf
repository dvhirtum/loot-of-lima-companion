# The built app, plus the same two proxies the dev server sets up.
#
# This file and proxy.conf.json are two spellings of one decision: the browser must see a single
# origin, because a cross-origin hub connection would need CORS on a server that has none.
#
# It is dropped into conf.d, which the stock nginx.conf includes from inside its http block --
# which is why the map below is legal here and would not be inside a server block.

# Websockets only get upgraded when the client asked for it. Echoing $http_connection straight
# through would send "Connection: upgrade" on ordinary long-polling requests as well.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    # The same port the dev server uses, on purpose. Stopping this container and running
    # `npm start` leaves the app at the address it was already at, so bookmarks keep working and
    # a QR code somebody already scanned still points somewhere real.
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # index.html is not hashed and is what points at everything that is, so a cached copy is a
    # cached copy of the whole app. Declared before the catch-all so it wins.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Hashed bundle names, so the bytes behind a given name never change.
    #
    # A regex location outranks every prefix location that is not ^~, which is why the two proxies
    # below carry it. Without it this block wins /api/games/ABCD/qr.png -- an endpoint, not a file
    # -- and serves a 404 for the QR code the whole join flow hangs off.
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /api/ {
        proxy_pass http://host.docker.internal:5000;
        include /etc/nginx/snippets/loot-proxy.conf;
    }

    location ^~ /hub/ {
        proxy_pass http://host.docker.internal:5000;
        include /etc/nginx/snippets/loot-proxy.conf;

        # SignalR. The upgrade pair is what lets a websocket through at all; buffering off is what
        # stops nginx holding a long-polling response until it has enough to forward, which would
        # turn every server push into a stall.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;

        # An idle websocket is a table thinking about its next question, not a dead connection.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Every route is client-side, so anything that is not a file on disk is the app itself.
    # Without this, refreshing on /play/ABCD is a 404 from nginx rather than a running game.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
